name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Stage flash bundle
        shell: bash
        run: |
          mkdir -p flash-bundle/build/bootloader flash-bundle/build/partition_table
          cp build/link-idf-example.bin                 flash-bundle/build/link-idf-example.bin
          cp build/bootloader/bootloader.bin            flash-bundle/build/bootloader/bootloader.bin
          cp build/partition_table/partition-table.bin  flash-bundle/build/partition_table/partition-table.bin

      - name: Upload flash bundle
        uses: actions/upload-artifact@v4
        with:
          name: ticker-firmware-${{ github.sha }}
          path: flash-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Commit binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git add -f build/link-idf-example.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin
          git diff --cached --quiet && echo "No binary changes" && exit 0
          git commit -m "ci: update firmware binaries [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed binaries (attempt $attempt)"; exit 0
            fi
            echo "Push rejected (attempt $attempt) -- recommitting onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git reset --soft FETCH_HEAD
            git add -f build/link-idf-example.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin
            git diff --cached --quiet && echo "Binaries already current on ${{ github.ref_name }}" && exit 0
            git commit -m "ci: update firmware binaries [skip ci]"
            sleep 3
          done
          echo "Failed to push binaries after retries"; exit 1
