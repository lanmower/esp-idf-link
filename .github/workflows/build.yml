name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Commit binaries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git add -f build/link-idf-example.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin
          git diff --cached --quiet && echo "No binary changes" && exit 0
          git commit -m "ci: update firmware binaries [skip ci]"
          # Retry around the push: a concurrent workflow (e.g. auto-declaudeify) can
          # advance the branch between our checkout and push, rejecting a stale ref.
          # Rebase our binary commit onto the latest ref and retry a few times.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed binaries (attempt $attempt)"; exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { git rebase --abort; sleep 3; }
          done
          echo "Failed to push binaries after retries"; exit 1
