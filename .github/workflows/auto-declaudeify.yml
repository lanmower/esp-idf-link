name: Auto-Declaudeify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report Claude-authored commits
        run: |
          COUNT=$(git log --all --author="Claude" --oneline | wc -l)
          echo "Claude-authored commits reachable from any ref: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "These are historical. Rewriting them requires a deliberate, exclusive"
            echo "history rewrite with no concurrent publish running, not an automated"
            echo "force-push on every branch push."
            git log --all --author="Claude" --oneline | head -20
          fi
